<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | BrightSmile Dental Clinic</title>
    <meta name="description" content="Book your dental appointment online. Easy, fast, and secure scheduling for teeth cleaning, consultation, braces, implants, and more.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        .page-header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 4rem 0;
            text-align: center;
        }

        .booking-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--white);
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            margin-top: -3rem;
            position: relative;
            z-index: 10;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: flex;
            gap: 1.5rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        input, select, textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-family: var(--font-family);
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            font-size: 1.1rem;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .booking-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body style="background-color: var(--bg-light);">

    <!-- Header -->
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo">
                <i class="fas fa-tooth"></i> BrightSmile
            </a>
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="testimonials.html">Reviews</a>
                <a href="blog.html">Tips</a>
                <a href="contact.html">Contact</a>
                <a href="book-appointment.html" class="btn btn-primary" style="background-color:#023e8a;">Book Now</a>
            </nav>
        </div>
    </header>

    <div class="page-header" style="padding-bottom: 7rem;">
        <div class="container">
            <h1 style="color:white;">Request an Appointment</h1>
            <p style="color:rgba(255,255,255,0.8); font-size:1.2rem; max-width: 600px; margin: 0 auto;">Take the first step towards a healthier, brighter smile.</p>
        </div>
    </div>

    <section class="container" style="margin-bottom: 5rem;">
        <div class="booking-container">
            <h2 style="text-align: center; color: var(--primary-color); margin-bottom: 2rem;">Patient Details</h2>
            
            <form id="appointmentForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" name="firstName" required placeholder="John">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" name="lastName" required placeholder="Doe">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required placeholder="(555) 123-4567">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="treatment">Treatment Selection *</label>
                        <select id="treatment" name="treatment" required>
                            <option value="">-- Select a Treatment --</option>
                            <option value="general-consult">General Consultation / Checkup</option>
                            <option value="cleaning">Teeth Cleaning</option>
                            <option value="implants">Dental Implants</option>
                            <option value="root-canal">Root Canal Treatment</option>
                            <option value="braces">Orthodontics (Braces)</option>
                            <option value="cosmetic">Cosmetic Dentistry</option>
                            <option value="emergency">Dental Emergency</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="preferredDate">Preferred Date *</label>
                        <input type="date" id="preferredDate" name="preferredDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Additional Message / Symptoms (Optional)</label>
                    <textarea id="message" name="message" rows="4" placeholder="Please describe any specific concerns or pain you are experiencing..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary submit-btn">Confirm Appointment Request</button>
                <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem; color: var(--text-light);">We will contact you shortly to confirm the exact time of your appointment.</p>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-bottom" style="border-top:none; padding-top: 0;">
                <p>&copy; 2024 BrightSmile Dental Clinic. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // Auto-select treatment based on URL parameter
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const treatmentParam = urlParams.get('treatment');
            if (treatmentParam) {
                const selectElement = document.getElementById('treatment');
                if (selectElement) {
                    // Try to match value
                    for (let i = 0; i < selectElement.options.length; i++) {
                        if (selectElement.options[i].value === treatmentParam) {
                            selectElement.selectedIndex = i;
                            break;
                        }
                    }
                }
            }
            
            // Set min date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('preferredDate').setAttribute('min', today);
        });
    </script>
</body>
</html>
